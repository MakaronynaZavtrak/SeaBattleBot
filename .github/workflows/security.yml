name: Security

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    # Еженедельно по понедельникам: ловит CVE, раскрытые уже после пуша
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy (dependencies, Dockerfile, secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Отчёт, а не блокировка сборки: транзитивные CVE появляются часто,
          # красить билд из-за неисправимого сразу — вредно. Результаты видны
          # во вкладке Security. Поставьте '1', если захотите жёстко валить сборку.
          exit-code: '0'

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
